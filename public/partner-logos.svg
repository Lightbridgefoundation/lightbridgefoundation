<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" role="img" aria-label="Partner organisations: Blacktown City Council, Cumberland City Council, African Resource Centre, Foodbank NSW and ACT, OzHarvest">
  <defs>
    <g id="pl-glyph">
      <path d="M0 22 Q14 2 28 22" fill="none" stroke="#182A44" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="3" y="24" width="22" height="3" rx="1.5" fill="#182A44"/>
    </g>
    <style>
      .pl-main { font: 700 21px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #182A44; letter-spacing: 0.04em; }
      .pl-sub { font: 600 12px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #182A44; letter-spacing: 0.28em; }
    </style>
  </defs>
  <!-- Blacktown City Council -->
  <g>
    <use href="#pl-glyph" x="16" y="66"/>
    <text class="pl-main" x="58" y="76">BLACKTOWN</text>
    <text class="pl-sub" x="58" y="98">CITY COUNCIL</text>
  </g>
  <!-- Cumberland City Council -->
  <g>
    <use href="#pl-glyph" x="256" y="66"/>
    <text class="pl-main" x="298" y="76">CUMBERLAND</text>
    <text class="pl-sub" x="298" y="98">CITY COUNCIL</text>
  </g>
  <!-- African Resource Centre -->
  <g>
    <use href="#pl-glyph" x="496" y="66"/>
    <text class="pl-main" x="538" y="76">AFRICAN RESOURCE</text>
    <text class="pl-sub" x="538" y="98">CENTRE</text>
  </g>
  <!-- Foodbank NSW &amp; ACT -->
  <g>
    <use href="#pl-glyph" x="736" y="66"/>
    <text class="pl-main" x="778" y="76">FOODBANK</text>
    <text class="pl-sub" x="778" y="98">NSW &amp; ACT</text>
  </g>
  <!-- OzHarvest -->
  <g>
    <use href="#pl-glyph" x="976" y="62"/>
    <text class="pl-main" x="1018" y="84">OZHARVEST</text>
  </g>
</svg>
